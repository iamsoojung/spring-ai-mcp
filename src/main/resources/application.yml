spring:
  application:
    name: spring-ai-mcp
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7

server:
  port: 8080

mcp:
  server:
    name: llama-assistant
    version: 1.0.0
    description: MCP server powered by Llama via Spring AI

logging:
  level:
    org.springframework.ai: DEBUG